name: Supabase database

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/supabase-db.yml"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-db.yml"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migration, lint, and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start isolated Postgres
        run: |
          docker network create \
            --driver bridge \
            --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            supabase-ci
          supabase db start --network-id supabase-ci --yes

      - name: Reset database from migrations
        run: supabase db reset --local --yes

      - name: Lint database
        run: supabase db lint --local --level warning --fail-on error

      - name: Test RLS and release workflow
        run: supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
